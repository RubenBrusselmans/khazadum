apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git
  template:
    metadata:
      labels:
        app: git
    spec:
      containers:
      - name: git
        image: codeberg.org/forgejo/forgejo:17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        env:
        - name: USER_UID
          value: "1000"
        - name: USER_GID
          value: "1000"
        - name: FORGEJO__server__DOMAIN
          value: "git.khazadum.net"
        - name: FORGEJO__server__ROOT_URL
          value: "https://git.khazadum.net/"
        - name: FORGEJO__server__START_SSH_SERVER
          value: "false"
        - name: FORGEJO__server__LANDING_PAGE
          value: "/user/oauth2/keycloak"
        - name: FORGEJO__openid__ENABLE_OPENID_SIGNIN
          value: "false"
        - name: FORGEJO__openid__ENABLE_OPENID_SIGNUP
          value: "false"
        - name: FORGEJO__webhook__ALLOWED_HOST_LIST
          value: "external,private"
        resources:
          requests: { cpu: 50m, memory: 320Mi }
        volumeMounts:
        - name: git-data
          mountPath: /var/lib/gitea
      volumes:
      - name: git-data
        hostPath:
          path: /data/crypt/git
          type: DirectoryOrCreate
