apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git
  template:
    metadata:
      labels:
        app: git
    spec:
      containers:
      - name: git
        image: codeberg.org/forgejo/forgejo:17.0.1@sha256:fcd19ff4ebc85fb098a67e8e1d0d5a84d07dd6e8a23edcfdfd5b71a6178953be
        ports:
        - containerPort: 3000
        env:
        - name: FORGEJO__server__DOMAIN
          value: "git.khazadum.net"
        - name: FORGEJO__server__ROOT_URL
          value: "http://git.khazadum.net/"
        - name: FORGEJO__server__START_SSH_SERVER
          value: "false"
        volumeMounts:
        - name: git-data
          mountPath: /data
      volumes:
      - name: git-data
        hostPath:
          path: /data/crypt/git
          type: DirectoryOrCreate
