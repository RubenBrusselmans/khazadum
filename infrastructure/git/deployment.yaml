apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git
  template:
    metadata:
      labels:
        app: git
    spec:
      containers:
      - name: git
        image: codeberg.org/forgejo/forgejo:16.0.7@sha256:c0fddfc04075e4198cc8e075fe6a1182984a5a7d5951c3a3c39b7fba2f10fbce
        ports:
        - containerPort: 3000
        env:
        - name: FORGEJO__server__DOMAIN
          value: "git.khazadum.net"
        - name: FORGEJO__server__ROOT_URL
          value: "http://git.khazadum.net/"
        - name: FORGEJO__server__START_SSH_SERVER
          value: "false"
        volumeMounts:
        - name: git-data
          mountPath: /data
      volumes:
      - name: git-data
        hostPath:
          path: /data/crypt/git
          type: DirectoryOrCreate
