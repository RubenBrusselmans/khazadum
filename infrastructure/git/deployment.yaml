apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: git
  template:
    metadata:
      labels:
        app: git
    spec:
      containers:
      - name: git
        image: codeberg.org/forgejo/forgejo:16.0.6@sha256:e2c34a699543ca8a00217ee9ab2bea5feedc98bd6d0ea95ec287d3b7ae1355c6
        ports:
        - containerPort: 3000
        env:
        - name: FORGEJO__server__DOMAIN
          value: "git.khazadum.net"
        - name: FORGEJO__server__ROOT_URL
          value: "http://git.khazadum.net/"
        - name: FORGEJO__server__START_SSH_SERVER
          value: "false"
        volumeMounts:
        - name: git-data
          mountPath: /data
      volumes:
      - name: git-data
        hostPath:
          path: /data/crypt/git
          type: DirectoryOrCreate
