apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-receiver
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matrix-receiver
  template:
    metadata:
      labels:
        app: matrix-receiver
    spec:
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matrix-alertmanager-receiver
          image: metio/matrix-alertmanager-receiver:2026.11.25@sha256:fc0fec5b6e1f90742550dfb24ab6b83a8d6b824344d5abf50d85eae27bc5eef1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --config-path=/config/config.yaml
            - --log-level=info
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MATRIX_USER_ID
              valueFrom:
                secretKeyRef:
                  name: matrix-receiver
                  key: MATRIX_USER_ID
            - name: MATRIX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matrix-receiver
                  key: MATRIX_ACCESS_TOKEN
            - name: MATRIX_ROOM_ID
              valueFrom:
                secretKeyRef:
                  name: matrix-receiver
                  key: MATRIX_ROOM_ID
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: config
          configMap:
            name: matrix-receiver-config
