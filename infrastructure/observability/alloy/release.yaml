apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    controller:
      type: daemonset # one pod per node

    alloy:
      # mount /var/log so alloy can tail pod logs
      # k3s uses containerd: /var/log/pods/ & /var/log/containers/
      mounts:
        varlog: true
      # only collect logs: discover pods, tail their logs, push to loki
      # metrics done by kube-prometheus-stack
      configMap:
        content: |
          // discover all pods in the cluster
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // tail logs from every discovered pod
          loki.source.kubernetes "all_pods" {
            targets    = discovery.kubernetes.pods.targets
            forward_to = [loki.write.loki.receiver]
          }

          // push to loki
          loki.write "loki" {
            endpoint {
               url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 256Mi }
