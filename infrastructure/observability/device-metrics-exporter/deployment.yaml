apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-metrics-exporter
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: device-metrics-exporter
  template:
    metadata:
      labels:
        app: device-metrics-exporter
    spec:
      hostname: device-metrics-exporter
      containers:
        - name: device-metrics-exporter
          image: docker.io/rocm/device-metrics-exporter:v1.5.2@sha256:d4f2706cc42a526aeba36da082f07bbdd74be9b4d6988ae16d914fb474de9f75
          args:
            - -monitor-gpu
          ports:
            - name: metrics
              containerPort: 5000
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
