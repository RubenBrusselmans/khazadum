# switched to OCI registry instead of HTTP for easy digest pinning
# renovate updates tag & digest through flux manager
# https://docs.renovatebot.com/modules/manager/flux/
# the chart digest is pinned, not the images
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 10m
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  ref:
    tag: 88.6.1
    digest: sha256:98ece3e66b6fede4b1964e8a94c356786bfccd97f570a9661445cbdb15ab054d
  # https://fluxcd.io/flux/components/source/ocirepositories/#layer-selector
  # pick the layer by type, not by position (88.5.4 swapped order)
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
