apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k3s-khazadum-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k3s-khazadum-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k3s khazadum.net internal root CA
  secretName: k3s-khazadum-root-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: RSA
    size: 4096
    rotationPolicy: Never
  issuerRef:
    name: k3s-khazadum-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k3s-khazadum-ca
spec:
  ca:
    secretName: k3s-khazadum-root-ca
