apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-khazadum-net
  namespace: kube-system
spec:
  secretName: wildcard-khazadum-net
  dnsNames:
    - khazadum.net
    - "*.khazadum.net"
  duration: 2160h # 90 days, renewed at 60 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: k3s-khazadum-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-khazadum-net
