apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: openwebui
        image: ghcr.io/open-webui/open-webui:main@sha256:ff7f7cbb4545aacec2c22d085b2bc406b299c119bd98747421124a1a6c03795f
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        env:
        - name: ENABLE_ADMIN_CHAT_ACCESS
          value: "false"
        - name: ENABLE_LOGIN_FORM
          value: "false"
        - name: OAUTH_AUTO_REDIRECT
          value: "true"
        - name: OAUTH_CLIENT_ID
          value: "openwebui"
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: openwebui
              key: OAUTH_CLIENT_SECRET
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        - name: OAUTH_PROVIDER_NAME
          value: "Keycloak"
        - name: OPENID_PROVIDER_URL
          value: "https://auth.khazadum.net/realms/khazadum/.well-known/openid-configuration"
        resources:
          requests: { cpu: 100m, memory: 1Gi }
          limits: { memory: 2Gi }
        volumeMounts:
        - name: openwebui-data
          mountPath: /app/backend/data
      volumes:
      - name: openwebui-data
        hostPath:
          path: /data/crypt/ai/openwebui
          type: Directory
