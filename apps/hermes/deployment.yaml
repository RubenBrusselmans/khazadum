apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:latest@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db
          args: ["gateway", "run"]
          ports:
            - containerPort: 8642
            - containerPort: 9119
          env:
            - name: HERMES_DASHBOARD
              value: "1"
          volumeMounts:
            - name: hermes
              mountPath: /opt/data
      volumes:
        - name: hermes
          hostPath:
            path: /data/crypt/hermes
            type: Directory
