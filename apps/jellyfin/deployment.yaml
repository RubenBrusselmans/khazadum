apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:latest@sha256:438e44330078e6b1a810fdec9dc0f4773e6595edb137c5eb4417a516da4c7f0e
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "100"
            - name: TZ
              value: "Europe/Brussels"
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: dev-dri
              mountPath: /dev/dri
          securityContext:
            privileged: true
      volumes:
        - name: jellyfin-config
          hostPath:
            path: /data/crypt/jellyfin
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /data/crypt/media
            type: DirectoryOrCreate
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
