apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:latest@sha256:1c60c32d1de1529cc58ea6c7879dd47f89d0d88082b085a66214243de3150b5c
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "100"
            - name: TZ
              value: "Europe/Brussels"
          ports:
            - containerPort: 8096
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 600Mi }
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: dev-dri
              mountPath: /dev/dri
          securityContext:
            privileged: true
      volumes:
        - name: jellyfin-config
          hostPath:
            path: /data/crypt/jellyfin
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /data/crypt/media
            type: DirectoryOrCreate
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
