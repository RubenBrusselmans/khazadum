apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        # Bake an optimized Keycloak build into a persistent hostPath once per
        # image version, so boots skip the Quarkus build (~7 min cold on HDD).
        # kc.sh resolves its home from its own path -> build the copy in place,
        # start the copy. Build output dir is atomic (build in .tmp, then mv).
        - name: bake
          image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
          restartPolicy: Always
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              VER=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /opt/keycloak/version.txt | head -1)
              DEST=/kc-opt/kc-$VER
              if [ -d "$DEST" ]; then
                echo "bake: $DEST already present, skipping build"
                exit 0
              fi
              echo "bake: building optimized server for version $VER"
              rm -rf /kc-opt/.tmp-kc /kc-opt/kc-"$VER"
              cp -a /opt/keycloak /kc-opt/.tmp-kc
              cd /kc-opt/.tmp-kc
              bin/kc.sh build
              mv /kc-opt/.tmp-kc "$DEST"
              chown -R 1000:0 "$DEST"
              touch "$DEST"
              # GC stale versions (never the current one); cp -a preserves old
              # mtimes, so only dirs we touched at build time age correctly.
              find /kc-opt -maxdepth 1 -name 'kc-*' ! -name "kc-$VER" -type d -mtime +60 -exec rm -rf {} +
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_HOSTNAME
              value: "https://auth.khazadum.net"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: kc-opt
              mountPath: /kc-opt
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          env:
            - name: POSTGRES_DB
              value: "keycloak"
            - name: PGDATA
              value: /var/lib/postgresql/data
            - name: POSTGRES_USER
              value: "keycloak"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - keycloak
                - -d
                - keycloak
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              VER=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' /opt/keycloak/version.txt | head -1)
              DEST=/kc-opt/kc-$VER
              if [ ! -x "$DEST/bin/kc.sh" ]; then
                echo "keycloak: no baked build at $DEST" >&2
                exit 1
              fi
              exec "$DEST/bin/kc.sh" start --optimized
          env:
            - name: KC_HOSTNAME
              value: "https://auth.khazadum.net"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "127.0.0.1"
            - name: KC_DB_URL_DATABASE
              value: "keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: DB_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: kc-opt
              mountPath: /kc-opt
      volumes:
        - name: kc-opt
          hostPath:
            path: /data/crypt/keycloak/kc-opt
            type: DirectoryOrCreate
        - name: postgres-data
          hostPath:
            path: /data/crypt/keycloak/postgres
            type: DirectoryOrCreate
