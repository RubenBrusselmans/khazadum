apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.7@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
          env:
            - name: POSTGRES_DB
              value: "keycloak"
            - name: PGDATA
              value: /var/lib/postgresql/data
            - name: POSTGRES_USER
              value: "keycloak"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - keycloak
                - -d
                - keycloak
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
        - name: keycloak
          image: git.khazadum.net/ruben/keycloak-khazadum:latest@sha256:e2ea4a463fe07344e8e02aaf917f8b9b38a04f441a5728fae8105d32a544ebb1
          command: ["/opt/keycloak/bin/kc.sh", "start", "--optimized"]
          env:
            - name: KC_HOSTNAME
              value: "https://auth.khazadum.net"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "127.0.0.1"
            - name: KC_DB_URL_DATABASE
              value: "keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: DB_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 1Gi }
      volumes:
        - name: postgres-data
          hostPath:
            path: /data/crypt/keycloak/postgres
            type: DirectoryOrCreate
