apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-js
  namespace: wiki-js
spec:
  rules:
    - host: wiki.khazadum.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wiki-js
                port:
                  number: 3000
