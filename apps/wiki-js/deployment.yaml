apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-js
  namespace: wiki-js
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiki-js
  template:
    metadata:
      labels:
        app: wiki-js
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wiki-js
          image: docker.io/requarks/wiki:3@sha256:bd4819960f2f9d35ef016653b97abf5fc0cd93a941d3baf34d2e79e4c9059169
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "wiki"
            - name: DB_USER
              value: "wiki"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: wiki-js
                  key: DB_PASSWORD
            - name: LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 640Mi }
        - name: postgres
          image: docker.io/library/postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_DB
              value: "wiki"
            - name: POSTGRES_USER
              value: "wiki"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiki-js
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/wiki
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - wiki
                - -d
                - wiki
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - wiki
                - -d
                - wiki
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 80Mi }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          hostPath:
            path: /data/crypt/wiki-js/db
            type: DirectoryOrCreate
