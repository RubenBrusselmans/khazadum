apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-js
  namespace: wiki-js
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiki-js
  template:
    metadata:
      labels:
        app: wiki-js
    spec:
      containers:
        - name: wiki-js
          image: docker.io/requarks/wiki:3@sha256:9424867464d9d899f975bbadb8ff1f794341eadd720b5fb5c22f0988c62e29bf
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "wiki"
            - name: DB_USER
              value: "wiki"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: wiki-js
                  key: DB_PASSWORD
            - name: LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: postgres
          image: docker.io/library/postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
          env:
            - name: POSTGRES_DB
              value: "wiki"
            - name: POSTGRES_USER
              value: "wiki"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiki-js
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/wiki
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - wiki
                - -d
                - wiki
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - wiki
                - -d
                - wiki
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          hostPath:
            path: /data/crypt/wiki-js/db
            type: DirectoryOrCreate
