when:
  - event: [push, manual]

workspace:
  base: /woodpecker
  path: src

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59

steps:
  validate:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
    commands:
      - apk add --no-cache py3-yaml
      - |
        python3 - <<EOF
        import yaml, glob, sys
        bad = 0
        for f in sorted(sum((glob.glob(p + "/**/*.yaml", recursive=True)
                             for p in ("apps", "infrastructure", "clusters", ".woodpecker")), [])):
            try:
                list(yaml.safe_load_all(open(f)))
            except yaml.YAMLError as e:
                bad += 1
                print(f"FAIL {f}: {e}")
        if bad:
            sys.exit(1)
        print("all YAML parse OK")
        EOF
