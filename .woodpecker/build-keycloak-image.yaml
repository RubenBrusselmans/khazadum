when:
  - event: push
    branch: main
    path: 'apps/keycloak/image/**'
  - event: manual

workspace:
  base: /woodpecker
  path: src

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59

steps:
  build:
    image: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
    commands:
      - SHA7=$$(echo $${CI_COMMIT_SHA} | cut -c1-7)
      - AUTH=$$(echo -n $${REGISTRY_USER}:$${REGISTRY_TOKEN} | base64 | tr -d '\n')
      - mkdir -p /kaniko/.docker
      - printf '{"auths":{"git.git.svc.cluster.local:3000":{"auth":"%s"}}}' "$${AUTH}" > /kaniko/.docker/config.json
      - /kaniko/executor --context /woodpecker/src/apps/keycloak/image --dockerfile Containerfile --destination git.git.svc.cluster.local:3000/ruben/keycloak-khazadum:latest --destination git.git.svc.cluster.local:3000/ruben/keycloak-khazadum:sha-$${SHA7} --insecure-registry git.git.svc.cluster.local:3000 --reproducible --skip-push-permission-check
