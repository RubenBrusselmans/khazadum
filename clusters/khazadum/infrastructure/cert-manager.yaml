apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: git
  path: ./infrastructure/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  prune: true
  force: true
