apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/observability
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  prune: true
  force: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
