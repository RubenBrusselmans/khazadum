apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/backup
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  prune: true
  force: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
