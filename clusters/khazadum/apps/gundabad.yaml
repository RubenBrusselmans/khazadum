---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gundabad
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: http://git.git.svc.cluster.local:3000/ruben/gundabad.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gundabad
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./
  sourceRef:
    kind: GitRepository
    name: gundabad
  wait: true
  prune: true
  force: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
