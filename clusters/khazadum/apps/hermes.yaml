apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: git
    - name: notifications
    - name: observability
    - name: backup
    - name: renovate
    - name: keycloak
    - name: nextcloud
    - name: jellyfin
    - name: homepage
  path: ./apps/hermes
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  prune: true
  force: true
