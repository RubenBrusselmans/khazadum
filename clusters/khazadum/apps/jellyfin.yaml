apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: git
    - name: notifications
    - name: observability
    - name: backup
    - name: renovate
  path: ./apps/jellyfin
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  prune: true
  force: true
